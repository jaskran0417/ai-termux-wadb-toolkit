name: Validate source and release metadata

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n uninstall.sh
          while IFS= read -r -d '' file; do
            if head -n 1 "$file" | grep -Eq 'bash|/sh$'; then
              bash -n "$file"
            fi
          done < <(find scripts -maxdepth 1 -type f -print0)
      - name: Check Python syntax
        run: python -m py_compile scripts/adb-mdns-discover
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find security release-tools -maxdepth 1 -type f -name '*.js' -print0 |
            while IFS= read -r -d '' file; do node --check "$file"; done
      - name: Validate JSON and SBOM
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool toolkit-manifest.json >/dev/null
          python -m json.tool SBOM.cdx.json >/dev/null
      - name: Check Apache-2.0 license metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          test -f NOTICE
          grep -q "Apache License" LICENSE
          grep -q "Version 2.0, January 2004" LICENSE
          python - <<'PY'
          import json
          with open("toolkit-manifest.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data["license"] == "Apache-2.0"
          version = open("VERSION", encoding="utf-8").read().strip()
          assert data["version"] == version
          with open("security/verify-installed.js", encoding="utf-8") as verifier_file:
              verifier = verifier_file.read()
          assert f"data.version !== '{version}'" in verifier
          assert "edition" not in data
          assert data["name"] == "AI Termux WADB Toolkit"
          with open("SBOM.cdx.json", encoding="utf-8") as f:
              sbom = json.load(f)
          root = sbom["metadata"]["component"]
          assert root["licenses"][0]["license"]["id"] == "Apache-2.0"
          PY
      - name: Check release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "1.0.4"
          test ! -e EDITION
          test -s docs/USER_GUIDE.md
          test -s docs/AI_GUIDE.md
          test -s docs/DESKTOP_COMMANDER_SETUP.md
          test ! -e docs/REMOTE_MCP_AI_CONNECTION.md
          grep -q 'Remote Desktop Commander' docs/DESKTOP_COMMANDER_SETUP.md
          grep -Fq 'REMOTE_MCP_AI_CONNECTION.md' install.sh
          grep -Fq 'for f in "$ROOT"/docs/*.md' install.sh
          test -s docs/COMMAND_REFERENCE.md
          test -s docs/TECHNICAL_REFERENCE.md
          test -s docs/FAQ.md
          test -s docs/USE_CASES.md
          grep -q 'AI-assisted setup is the recommended method' README.md
          grep -Fq '1. **Recommended method — AI-assisted setup (default).**' README.md
          grep -Fq '2. **Manual setup — fallback only.**' README.md
          grep -Fq 'Do not ask the owner to download/extract the ZIP' README.md
          grep -Fq 'the single Point 1 in its first reply' docs/AI_GUIDE.md
          grep -Fq 'Never hand the owner a manual Toolkit command sequence' docs/AI_GUIDE.md
          grep -Fq '1. **Recommended method — AI-assisted setup (default).**' docs/USER_GUIDE.md
          grep -Fq '2. **Manual setup — secondary fallback only.**' docs/USER_GUIDE.md
      - name: Check for accidental private signing material
        shell: bash
        run: |
          if find . -type f \( -iname '*.p12' -o -iname '*.pfx' -o -iname '*.jks' -o -iname '*.keystore' -o -name 'keystore.pass' -o -name 'apksigner.pass' -o -name 'key.b64' \) -print -quit | grep -q .; then
            echo "Private signing material found in repository tree."
            exit 1
          fi